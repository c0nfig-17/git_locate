[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-locate"
version = "0.1.0"
description = "GitHub recon discovery — locate orgs, repos and users related to a company"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "c0nfig-17" }]
keywords = ["recon", "osint", "github", "bugbounty", "pentest", "discovery"]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/c0nfig-17/git_locate"

[project.scripts]
gitlocate = "gitlocate.cli:main"

[tool.setuptools]
packages = ["gitlocate", "gitlocate.sources", "gitlocate.output"]
